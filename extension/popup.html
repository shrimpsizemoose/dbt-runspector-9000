<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 12px;
      min-width: 350px;
      max-width: 400px;
      margin: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #666;
      font-size: 16px;
    }
    .settings-btn:hover {
      color: #333;
    }
    .empty {
      color: #999;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    .view-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .view-item {
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .view-item:hover {
      background: #f5f5f5;
    }
    .view-source {
      font-family: monospace;
      font-size: 11px;
      color: #333;
      word-break: break-all;
      margin-bottom: 6px;
    }
    .view-stats {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .stat {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .stat-success { background: #22c55e; color: #fff; }
    .stat-pass { background: #86efac; color: #166534; }
    .stat-error { background: #ef4444; color: #fff; }
    .stat-fail { background: #fecdd3; color: #9f1239; }
    .stat-warn { background: #fbbf24; color: #78350f; }
    .stat-skipped { background: #d1d5db; color: #374151; }
    .view-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
    }
    .view-time {
      color: #666;
    }
    .view-expires {
      color: #999;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .error {
      color: #c00;
      font-size: 12px;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Recent Visualizations</h1>
    <button class="settings-btn" id="settingsBtn" title="Settings">&#9881;</button>
  </div>
  <div id="content">
    <div class="loading">Loading...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
